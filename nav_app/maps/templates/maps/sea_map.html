{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Navigation Learning - Mercator Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'maps/css/sea_map.css' %}">
</head>
<body>

<div id="map"></div>

<!-- Leaflet JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"></script>

<!-- Global variables passed from Django -->
<script>
    window.initialLat = {{ lat }};
    window.initialLon = {{ lon }};
</script>

<!-- Custom JavaScript modules (loaded in dependency order) -->
<script src="{% static 'maps/js/graticule/graticule_formatter.js' %}"></script>
<script src="{% static 'maps/js/core/map_controls.js' %}"></script>
<script src="{% static 'maps/js/course/course_plotter.js' %}"></script>
<script src="{% static 'maps/js/nautical/nautical_triangles.js' %}"></script>
<script src="{% static 'maps/js/nautical/nautical_triangles_leaflet.js' %}"></script>
<script src="{% static 'maps/js/nautical/nautical_divider.js' %}"></script>
<script src="{% static 'maps/js/nautical/nautical_divider_leaflet.js' %}"></script>
<script src="{% static 'maps/js/gpx/gpx_parser.js' %}"></script>
<script src="{% static 'maps/js/gpx/gpx_route_leaflet.js' %}"></script>
<script src="{% static 'maps/js/observed_position/observed_position.js' %}"></script>
<script src="{% static 'maps/js/geometry/geometry_model.js' %}"></script>
<script src="{% static 'maps/js/geometry/geometry_leaflet.js' %}"></script>
<script src="{% static 'maps/js/nautical/nautical_latitude_scale.js' %}"></script>
<script src="{% static 'maps/js/course/magnetic_declination.js' %}"></script>
<script src="{% static 'maps/js/core/main_map.js' %}"></script>

{% if task %}
<style>
    #seaMapTaskWrap {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 380px;
        max-height: calc(100vh - 32px);
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        padding: 14px;
        overflow-y: auto;
        z-index: 4000;
    }
</style>
<div id="seaMapTaskWrap">
    {% include 'maps/_task_panel.html' %}
</div>
{% endif %}

</body>
</html>
