databases:
  - name: nav-db
    plan: free
    databaseName: nav_app
    user: nav_app

services:
  - type: web
    name: nav-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nav-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"