{% load static %}
{{ task.payload|json_script:"task-data" }}

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.2/dist/purify.min.js" crossorigin="anonymous"></script>
<script src="{% static 'maps/js/navigation/angle_units.js' %}"></script>

<style>
    .task-panel-content {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #1f2937;
        font-size: 0.9em;
        line-height: 1.5;
    }
    .task-panel-content h3.task-title {
        color: #0078A8;
        margin: 0 0 4px;
        font-size: 1.1em;
    }
    .task-panel-content .task-meta {
        color: #6b7280;
        font-size: 0.85em;
        margin-bottom: 10px;
    }
    .task-panel-content .task-content {
        margin-bottom: 12px;
    }
    .task-panel-content .task-content h1,
    .task-panel-content .task-content h2,
    .task-panel-content .task-content h3 { margin: 0.8em 0 0.3em; line-height: 1.3; }
    .task-panel-content .task-content h1 { font-size: 1.2em; }
    .task-panel-content .task-content h2 { font-size: 1.1em; }
    .task-panel-content .task-content h3 { font-size: 1.0em; }
    .task-panel-content .task-content p { margin: 0.4em 0; }
    .task-panel-content .task-content ul,
    .task-panel-content .task-content ol { padding-left: 1.3em; margin: 0.4em 0; }
    .task-panel-content .task-content code {
        background: #eef2ff;
        padding: 1px 5px;
        border-radius: 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
    }
    .task-panel-content .task-content pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 10px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 0.85em;
    }
    .task-panel-content .task-content pre code { background: transparent; padding: 0; color: inherit; }
    .task-panel-content .task-content table {
        border-collapse: collapse;
        width: 100%;
        margin: 0.5em 0;
        font-size: 0.85em;
    }
    .task-panel-content .task-content th,
    .task-panel-content .task-content td {
        border: 1px solid #e5e7eb;
        padding: 4px 6px;
        text-align: left;
    }
    .task-panel-content .task-content th { background: #f9fafb; }
    .task-panel-content .task-content img { max-width: 100%; height: auto; }
    .task-panel-content .task-content blockquote {
        border-left: 3px solid #93c5fd;
        margin: 0.5em 0;
        padding-left: 10px;
        color: #4b5563;
    }
    .task-panel-content .task-content a { color: #2563eb; }

    .task-panel-content details {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        background: #fff;
    }
    .task-panel-content details summary {
        cursor: pointer;
        font-weight: 600;
        color: #374151;
        font-size: 0.9em;
    }
    .task-panel-content details[open] { padding-bottom: 10px; }
    .task-panel-content details table {
        border-collapse: collapse;
        font-size: 0.82em;
        margin-top: 6px;
        width: 100%;
    }
    .task-panel-content details th,
    .task-panel-content details td {
        border: 1px solid #e5e7eb;
        padding: 3px 6px;
    }
    .task-panel-content details ul { padding-left: 1.2em; margin: 4px 0; }

    .task-panel-content .show-solution-btn {
        background: #b45309;
        color: #fff;
        border: none;
        padding: 10px 14px;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
    }
    .task-panel-content .show-solution-btn:hover { background: #92400e; }
    .task-panel-content .solution-section { margin-top: 14px; }
    .task-panel-content .solution-section h4 {
        margin: 10px 0 6px;
        font-size: 0.95em;
        color: #374151;
    }
    .task-panel-content .solution-section[hidden] { display: none !important; }
    .task-panel-content .solution-section .trk-wrap { overflow-x: auto; }
    .task-panel-content .solution-section table {
        border-collapse: collapse;
        font-size: 0.78em;
        width: 100%;
    }
    .task-panel-content .solution-section th,
    .task-panel-content .solution-section td {
        border: 1px solid #e5e7eb;
        padding: 3px 5px;
        white-space: nowrap;
    }
    .task-panel-content .solution-section th { background: #fef3c7; }
</style>

<div class="task-panel-content" id="taskPanelContent">
    <h3 class="task-title" id="taskTitle">Task</h3>
    <div class="task-meta">by <span id="taskAuthor"></span></div>
    <div class="task-content" id="taskContent"></div>

    <details>
        <summary>Navigation parameters</summary>
        <div id="taskParams"></div>
    </details>
    <details>
        <summary>Points of interest</summary>
        <ul id="taskPois"></ul>
    </details>
    {% if task.payload.task.chart %}
    <details>
        <summary>Chart</summary>
        <div id="taskChart"></div>
    </details>
    {% endif %}

    <button type="button" class="show-solution-btn" id="showSolutionBtn">Show the solution</button>
    <section class="solution-section" id="solutionPanel" hidden>
        <h4>Solution — track</h4>
        <div class="trk-wrap" id="solutionTrk"></div>
        <h4>Comment</h4>
        <p id="solutionComment"></p>
    </section>
</div>

<script>
(function () {
    const raw = document.getElementById('task-data');
    if (!raw) return;
    const data = JSON.parse(raw.textContent);
    const task = data.task || {};
    const meta = task.meta || {};
    const nav = task.navigation || {};
    const chart = task.chart || null;
    const pois = data.poi || [];
    const solution = data.solution || {};

    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    document.getElementById('taskTitle').textContent = meta.title || 'Task';
    document.getElementById('taskAuthor').textContent = meta.author || '';

    const contentEl = document.getElementById('taskContent');
    const md = meta.content_md;
    if (md && md.trim() && window.marked && window.DOMPurify) {
        const html = window.marked.parse(md, { gfm: true, breaks: false });
        contentEl.innerHTML = window.DOMPurify.sanitize(html, {
            ALLOWED_TAGS: ['p','br','strong','em','code','pre','blockquote',
                           'ul','ol','li','h1','h2','h3','h4','h5','h6',
                           'a','img','hr','table','thead','tbody','tr','th','td',
                           'span','div','del','sub','sup'],
            ALLOWED_ATTR: ['href','title','alt','src','class'],
        });
        contentEl.querySelectorAll('a[href]').forEach(a => {
            a.target = '_blank';
            a.rel = 'noopener noreferrer ugc';
        });
    } else {
        contentEl.textContent = meta.desc || '';
    }

    const paramsEl = document.getElementById('taskParams');
    const parts = [];
    if (nav.timezone) {
        parts.push(`<div><strong>Timezone:</strong> ${escapeHtml(nav.timezone.name)} (${escapeHtml(nav.timezone.offset)})</div>`);
    }
    if (Array.isArray(nav.magnetic_variation_list) && nav.magnetic_variation_list.length) {
        parts.push('<div style="margin-top:6px"><strong>Magnetic variation:</strong></div>');
        parts.push('<table><thead><tr><th>Base °</th><th>Year</th><th>Δ′/yr</th><th>Lat</th><th>Lon</th><th>Range nm</th></tr></thead><tbody>');
        nav.magnetic_variation_list.forEach(v => {
            // Stored in degrees, shown in minutes — the unit it was entered in.
            const annualChangeMin = roundTo(degreesToMinutes(v.annual_change_deg), 1);
            parts.push(`<tr><td>${v.base_deg}</td><td>${v.base_year}</td><td>${annualChangeMin}</td><td>${v.lat}</td><td>${v.lon}</td><td>${v.range_nm}</td></tr>`);
        });
        parts.push('</tbody></table>');
    }
    if (Array.isArray(nav.compass_deviation_table) && nav.compass_deviation_table.length) {
        parts.push('<div style="margin-top:6px"><strong>Compass deviation:</strong></div>');
        parts.push('<table><thead><tr><th>Heading °</th><th>Deviation °</th></tr></thead><tbody>');
        nav.compass_deviation_table.forEach(r => {
            parts.push(`<tr><td>${r.heading_deg}</td><td>${r.deviation_deg}</td></tr>`);
        });
        parts.push('</tbody></table>');
    }
    if (nav.leeway) {
        parts.push('<div style="margin-top:6px"><strong>Leeway:</strong></div><ul>');
        Object.entries(nav.leeway).forEach(([k, v]) => {
            const range = v.range || {};
            parts.push(`<li>${escapeHtml(k.replace(/_/g, ' '))}: ${range.min_deg}°–${range.max_deg}° → ${v.value_deg}°</li>`);
        });
        parts.push('</ul>');
    }
    paramsEl.innerHTML = parts.join('');

    const poiList = document.getElementById('taskPois');
    pois.forEach(p => {
        const li = document.createElement('li');
        li.textContent = `${p.name} (${p.type}) — ${p.lat}, ${p.lon}`;
        if (p.description) {
            const small = document.createElement('div');
            small.style.color = '#6b7280';
            small.style.fontSize = '0.85em';
            small.textContent = p.description;
            li.appendChild(small);
        }
        poiList.appendChild(li);
    });

    if (chart) {
        const chartEl = document.getElementById('taskChart');
        if (chartEl) {
            const b = chart.bounds || {};
            const m = chart.margins || {};
            chartEl.innerHTML =
                `<div><strong>File:</strong> ${escapeHtml(chart.file_name)}</div>` +
                `<div><strong>Bounds:</strong> N ${b.north_lat_deg}, S ${b.south_lat_deg}, W ${b.west_lon_deg}, E ${b.east_lon_deg}</div>` +
                `<div><strong>Margins:</strong> T ${m.top}, B ${m.bottom}, L ${m.left}, R ${m.right}</div>`;
        }
    }

    document.getElementById('showSolutionBtn').addEventListener('click', function () {
        const panel = document.getElementById('solutionPanel');
        const btn = this;
        btn.hidden = true;
        panel.hidden = false;

        const trk = Array.isArray(solution.trk) ? solution.trk : [];
        const trkHtml = ['<table><thead><tr>',
            '<th>ID</th><th>Time</th><th>Position</th><th>Dist nm</th><th>Log nm</th>',
            '<th>Comp °</th><th>True °</th><th>COG °</th><th>Wind T °</th><th>Wind A °</th><th>Speed kn</th>',
            '</tr></thead><tbody>'];
        trk.forEach(p => {
            const pos = p.position || {};
            trkHtml.push(`<tr>
                <td>${escapeHtml(p.id)}</td>
                <td>${escapeHtml(p.time)}</td>
                <td>${escapeHtml(pos.position_txt)}</td>
                <td>${p.distance_nm}</td>
                <td>${p.log_nm}</td>
                <td>${p.course_compass_deg}</td>
                <td>${p.course_true_deg}</td>
                <td>${p.course_over_ground_deg}</td>
                <td>${p.wind_true_deg}</td>
                <td>${p.wind_app_deg}</td>
                <td>${p.speed_kn}</td>
            </tr>`);
        });
        trkHtml.push('</tbody></table>');
        document.getElementById('solutionTrk').innerHTML = trkHtml.join('');

        document.getElementById('solutionComment').textContent = solution.comment || '';
    });
})();
</script>
