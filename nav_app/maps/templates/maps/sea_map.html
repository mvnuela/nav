{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Navigation Learning - Mercator Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'maps/css/sea_map.css' %}">
</head>
<body>

<div id="map"></div>

<!-- Leaflet JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"></script>

<!-- Global variables passed from Django -->
<script>
    window.initialLat = {{ lat }};
    window.initialLon = {{ lon }};
</script>

<!-- Custom JavaScript modules (loaded in dependency order) -->
<script src="{% static 'maps/js/graticule_formatter.js' %}"></script>
<script src="{% static 'maps/js/map_controls.js' %}"></script>
<script src="{% static 'maps/js/course_plotter.js' %}"></script>
<script src="{% static 'maps/js/dr_calculator.js' %}"></script>
<script src="{% static 'maps/js/maritime_objects.js' %}"></script>
<script src="{% static 'maps/js/nautical_triangles.js' %}"></script>
<script src="{% static 'maps/js/nautical_triangles_leaflet.js' %}"></script>
<script src="{% static 'maps/js/nautical_divider.js' %}"></script>
<script src="{% static 'maps/js/nautical_divider_leaflet.js' %}"></script>
<script src="{% static 'maps/js/gpx_parser.js' %}"></script>
<script src="{% static 'maps/js/gpx_route_leaflet.js' %}"></script>
<script src="{% static 'maps/js/observed_position.js' %}"></script>
<script src="{% static 'maps/js/geometry_model.js' %}"></script>
<script src="{% static 'maps/js/geometry_leaflet.js' %}"></script>
<script src="{% static 'maps/js/main_map.js' %}"></script>

</body>
</html>
