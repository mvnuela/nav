services:
  db:
    image: postgres:16-alpine
    container_name: nav_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nav_app
      - POSTGRES_USER=nav_app
      - POSTGRES_PASSWORD=nav_app_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav_app -d nav_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: nav_app
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 nav_app.wsgi:application
    volumes:
      - ./nav_app:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=your-secret-key-here-change-in-production
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
      - POSTGRES_DB=nav_app
      - POSTGRES_USER=nav_app
      - POSTGRES_PASSWORD=nav_app_dev_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  postgres_data: