<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Accept invitation</title>
</head>
<body>
    <h1>Accept invitation</h1>

    <p>
        You were invited to join as a <strong>{{ invitation.get_role_display }}</strong>
        by {{ invitation.created_by.username }}.
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>
</body>
</html>
