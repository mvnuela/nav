<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · Sea Navigation Learning</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1f2937;
        }

        .card {
            background: #fff;
            max-width: 420px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 44px 40px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .card-header .brand {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .card-header h1 {
            color: #667eea;
            font-size: 1.8em;
        }

        form p { margin-bottom: 16px; }
        form label {
            display: block;
            font-weight: 600;
            color: #374151;
            font-size: 0.88em;
            margin-bottom: 6px;
        }
        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
            background: #fff;
            color: #1f2937;
        }
        form input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.18);
        }
        form .helptext {
            display: block;
            margin-top: 4px;
            font-size: 0.8em;
            color: #6b7280;
        }
        form .errorlist {
            list-style: none;
            padding: 0;
            margin: 0 0 12px;
            color: #b91c1c;
            font-size: 0.88em;
        }

        .submit {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font: inherit;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.35);
        }

        .invite-note {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            color: #6b7280;
            font-size: 0.9em;
            text-align: center;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85em;
        }
        .footer a {
            color: #fff;
            opacity: 0.85;
            text-decoration: none;
        }
        .footer a:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>
    <div>
        <div class="card">
            <div class="card-header">
                <div class="brand">⚓ Sea Navigation Learning</div>
                <h1>Log in</h1>
            </div>

            {% if form.non_field_errors %}
                <ul class="errorlist">
                    {% for err in form.non_field_errors %}<li>{{ err }}</li>{% endfor %}
                </ul>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="submit">Log in</button>
            </form>

            <p class="invite-note">
                Accounts are by invitation only. Ask a teacher or administrator for an invite link.
            </p>
        </div>
        <div class="footer">
            <a href="{% url 'maps:index' %}">← Back to home</a>
        </div>
    </div>
</body>
</html>
